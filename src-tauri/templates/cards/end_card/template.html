<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--CARD_HEAD-->
    <style>
      .backdrop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60vmin 60vmin at 50% 42%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
          rgba(12, 15, 20, 0.9);
      }
      .block {
        position: absolute;
        inset: 0 8vmin;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vmin;
        text-align: center;
      }
      img[data-logo] {
        max-height: 18vmin;
        max-width: 50vmin;
      }
      h1 {
        margin: 0;
        width: 100%;
        max-height: 22vmin;
        font-size: 9vmin;
        font-weight: 800;
        line-height: 1.1;
        overflow: hidden;
      }
      .handle {
        margin: 0;
        width: 100%;
        max-height: 8vmin;
        font-size: 4.2vmin;
        font-weight: 500;
        opacity: 0.86;
        overflow: hidden;
      }
      .cta {
        margin-top: 1.6vmin;
        max-width: 80%;
        padding: 2.2vmin 5.4vmin;
        border-radius: 999px;
        background: linear-gradient(100deg, var(--primary), var(--accent));
        color: #0b0e13;
        font-size: 4.4vmin;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        box-shadow: 0 1.2vmin 3.6vmin rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="block">
      <img data-logo alt="" />
      <h1 class="gradient-text" data-slot="headline" data-fit></h1>
      <p class="handle" data-slot="subline" data-fit></p>
      <div class="cta" data-slot="cta" data-fit></div>
    </div>
    <!--CARD_RUNTIME-->
  </body>
</html>
