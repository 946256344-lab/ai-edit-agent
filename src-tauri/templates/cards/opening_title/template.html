<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--CARD_HEAD-->
    <style>
      .scrim {
        position: absolute;
        inset: 38% 0 0 0;
        background: linear-gradient(180deg, rgba(8, 11, 16, 0) 0%, rgba(8, 11, 16, 0.55) 45%, rgba(8, 11, 16, 0.78) 100%);
      }
      .block {
        position: absolute;
        left: 7vmin;
        right: 7vmin;
        bottom: 22%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.4vmin;
        text-align: center;
      }
      [data-aspect="landscape"] .block {
        bottom: 16%;
        left: 12vw;
        right: 12vw;
      }
      img[data-logo] {
        max-height: 11vmin;
        max-width: 38vmin;
      }
      h1 {
        margin: 0;
        width: 100%;
        max-height: 30vmin;
        font-size: 12vmin;
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.02em;
        overflow: hidden;
      }
      p {
        margin: 0;
        width: 100%;
        max-height: 12vmin;
        font-size: 4.6vmin;
        font-weight: 500;
        line-height: 1.25;
        opacity: 0.94;
        overflow: hidden;
        text-shadow: 0 0.3vmin 1.2vmin rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="scrim"></div>
    <div class="block">
      <img data-logo alt="" />
      <div class="lift" style="width: 100%">
        <h1 class="gradient-text" data-slot="headline" data-fit></h1>
      </div>
      <p data-slot="subline" data-fit></p>
    </div>
    <!--CARD_RUNTIME-->
  </body>
</html>
