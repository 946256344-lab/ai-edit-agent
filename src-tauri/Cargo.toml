[package]
name = "assembly-video-agent"
default-run = "assembly-video-agent"
version = "0.1.2"
description = "A Windows-first local video editing Agent"
authors = ["Voycut"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
footage-eval = []

[[bin]]
name = "footage-eval"
path = "src/bin/footage_eval.rs"
required-features = ["footage-eval"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
keyring = { version = "3.6", features = ["windows-native"] }
rand = "0.9"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = "2.12"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fastembed = { version = "4.9.1", default-features = false }
tiktoken-rs = "=0.11.0"
# fastembed 关闭联网功能；这里只让构建期取得并随桌面程序复制 ONNX Runtime。
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["copy-dylibs", "download-binaries", "directml"] }

# 品牌卡渲染：独立线程里的隐藏 WebView2，版本与 wry 已用的保持一致。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_LibraryLoader"] }

# 开发版也优化依赖库：图片解码缩放、fastembed 预处理在未优化时慢约 6 倍，开发版测出的耗时会严重失真。
# 只影响依赖，本项目代码仍按 dev 配置编译，调试不受影响。
[profile.dev.package."*"]
opt-level = 3
